version: "3.8"

# TradeThrone — STAGING infrastructure (PostgreSQL + Redis)
# Purpose: production-like data store + cache for Phase 3 controlled testing.
# Broker execution stays SIMULATED (BROKER_MODE=simulated in backend env).
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   DATABASE_URL=postgresql://tradetron:tradetron@localhost:5433/tradetron
#   REDIS_URL=redis://localhost:6379/0

services:
  postgres-staging:
    image: postgres:15-alpine
    container_name: tradetron-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradetron_staging
      POSTGRES_USER: tradetron
      POSTGRES_PASSWORD: tradetron_staging_password
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with any local 5432
    volumes:
      - tradetron_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradetron -d tradetron_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-staging:
    image: redis:7-alpine
    container_name: tradetron-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tradetron_staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tradetron_staging_pgdata:
  tradetron_staging_redisdata:
