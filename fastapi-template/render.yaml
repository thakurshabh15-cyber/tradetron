# Render Blueprint Specification for Tradetron Platform
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tradetron-backend
    runtime: python
    region: oregon
    plan: starter
    # ROOT CAUSE FIX (Phase 5B): the FastAPI app lives at fastapi-template/app,
    # not at the git repo root (which contains other projects and a decoy
    # main.py). Without rootDir, Render runs `uvicorn app.main:app` from the
    # repo root, `app.main` fails to import, the service never boots, and
    # Render's edge returns HTTP 404 "x-render-routing: no-server" on every
    # endpoint. rootDir pins the build/run working directory to the backend.
    rootDir: fastapi-template
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tradetron-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://tradethrone.vercel.app
      # Phase 5D: lock CORS to the exact production frontends. `*` is invalid
      # with allow_credentials=True and must never ship in production; the app
      # also auto-locks to these domains when ENVIRONMENT=production.
      - key: ALLOWED_ORIGINS
        value: https://tradethrone.vercel.app,https://tradethron.vercel.app
      - key: BROKER_MODE
        value: simulated
      # ── Phase 5D CACHE (REQUIRED in production) ─────────────────────────────
      # The app refuses to boot in production without an explicit Redis URL
      # (no silent localhost fallback). Render Blueprints CANNOT auto-provision
      # Key Value (Redis) instances — they must be created in the Dashboard and
      # linked to this service:
      #
      #   A) Render Key Value (recommended — no external signup):
      #      1. Create: https://dashboard.render.com/new/redis
      #      2. Set the region to oregon (same as this service) and a plan.
      #      3. Under "Linked Services" add `tradetron-backend`.
      #      Render then auto-injects REDIS_URL (e.g. redis://red-xxxx:6379)
      #      into this service — no manual secret entry needed.
      #
      #   B) External managed Redis (e.g. Upstash rediss://…):
      #      Add UPSTASH_REDIS_URL as a secret in the Render dashboard.
      #      `Settings.effective_redis_url` prefers it over the plain REDIS_URL.
      #
      # NOTE: No REDIS_URL / UPSTASH_REDIS_URL value is committed here on
      # purpose — the previous placeholder (rediss://REPLACE_WITH_UPSTASH_TLS_URL)
      # must never be committed/applied. Add the real value in Render, then
      # re-deploy and confirm /readyz reports cache=true.
      # ── Phase 5D REAL MARKET DATA (crypto) ────────────────────────────────
      # Enables CoinGecko public REST API (no credentials). Real crypto ticks
      # are labeled LIVE/STALE by data_status; equities/forex/commodity remain
      # DEMO. This is MARKET DATA ONLY — BROKER_MODE stays simulated so no
      # real-money order can ever be dispatched.
      - key: FEED_MODE_CRYPTO
        value: live
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: tradetron-postgres
    region: oregon
    plan: starter
    databaseName: tradetron
    user: tradetron
