# Render Blueprint Specification for Tradetron Platform
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tradetron-backend
    runtime: python
    region: oregon
    plan: starter
    # ROOT CAUSE FIX (Phase 5B): the FastAPI app lives at fastapi-template/app,
    # not at the git repo root (which contains other projects and a decoy
    # main.py). Without rootDir, Render runs `uvicorn app.main:app` from the
    # repo root, `app.main` fails to import, the service never boots, and
    # Render's edge returns HTTP 404 "x-render-routing: no-server" on every
    # endpoint. rootDir pins the build/run working directory to the backend.
    rootDir: fastapi-template
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tradetron-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BROKER_MODE
        value: simulated
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: tradetron-postgres
    region: oregon
    plan: starter
    databaseName: tradetron
    user: tradetron
