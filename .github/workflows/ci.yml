name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + pip check + alembic drift + secret scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-template
    env:
      BROKER_MODE: simulated
      ENVIRONMENT: testing

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: tests/test_env_separation.py audits the
          # tracked .env.production blob at historical commit 4502f2a via
          # `git show`. The checkout default (fetch-depth: 1, single commit)
          # makes that commit unresolvable and fails
          # test_production_env_git_history_contains_no_real_credentials.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: pip check (declared dependency conflicts)
        run: python -m pip check

      - name: Backend test suite (BROKER_MODE=simulated)
        run: python -m pytest -q --no-header

      - name: Alembic drift guard (isolated temp SQLite)
        run: python scripts/ci_alembic_check.py

      - name: Secret scan (whole-repo credential patterns)
        shell: bash
        run: |
          set -euo pipefail
          # Deterministic whole-repo scan (docs/root included) via the Python
          # scanner. It reads `git ls-files` output, skips binary artifacts and
          # .env example templates, and flags live credential shapes (Stripe /
          # Razorpay live keys, AWS/GitHub/Slack tokens, CoinGecko/Anthropic
          # keys, private keys, 32+ char JWT_SECRET assignments and real
          # env-file dumps). Replaces the old grep pair which could not cover
          # docs and whose pathspec exclusions were brittle.
          python scripts/ci_secret_scan.py

  frontend:
    name: Frontend (Vite production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-template/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastapi-template/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build